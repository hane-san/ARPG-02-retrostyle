name: Atlas checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify JavaScript, pathfinding, camera and sound rules
        run: npm run check
  browser_checks:
    name: browser (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [core, landscapes, journey, fixed, atlas]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile-viewport smoke tests
        env:
          BROWSER_GROUP: ${{ matrix.group }}
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-evidence-${{ matrix.group }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: browser
    runs-on: ubuntu-latest
    needs: browser_checks
    if: always()
    steps:
      - name: Require every browser group to pass
        env:
          BROWSER_RESULT: ${{ needs.browser_checks.result }}
        run: test "$BROWSER_RESULT" = success
